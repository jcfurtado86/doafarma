openapi: 3.0.3
info:
  title: DoaFarma API
  description: |
    API for the DoaFarma medication donation platform.

    ## Authentication
    All endpoints (except login and registration) require Bearer token authentication.
    Obtain a token via POST /api/login.

    ## User Status
    Users must be approved by an admin before accessing most API endpoints.
    Pending or rejected users will receive a 403 error.
  version: 1.0.0
  contact:
    name: DoaFarma Support
    email: suporte@doafarma.com

servers:
  - url: http://localhost:8000/api
    description: Development
  - url: https://api.doafarma.com/api
    description: Production

tags:
  - name: Authentication
    description: Login and registration endpoints
  - name: Drugs
    description: Drug catalog operations
  - name: Medication Offerings
    description: Doctor medication offerings
  - name: Medication Requests
    description: Receptor medication requests
  - name: Medication Appointments
    description: Delivery scheduling
  - name: Doctor Ratings
    description: Doctor evaluation system
  - name: Push Tokens
    description: Push notification management

security:
  - bearerAuth: []

paths:
  /login:
    post:
      tags:
        - Authentication
      summary: Authenticate user
      description: Authenticate with email and password to receive an access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - device_name
              properties:
                email:
                  type: string
                  format: email
                  example: doctor@example.com
                password:
                  type: string
                  format: password
                  example: password123
                device_name:
                  type: string
                  example: iPhone 15
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many attempts

  /register/doctor:
    post:
      tags:
        - Authentication
      summary: Register as doctor
      description: Create a new doctor account. Account will be pending until admin approval.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorRegistration'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /register/receptor:
    post:
      tags:
        - Authentication
      summary: Register as receptor
      description: Create a new receptor account. Account will be pending until admin approval.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceptorRegistration'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /v1/drugs:
    get:
      tags:
        - Drugs
      summary: List all drugs
      description: Get paginated list of drugs from the ANVISA catalog.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
            maximum: 100
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Drug'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /v1/drugs/search:
    get:
      tags:
        - Drugs
      summary: Search drugs
      description: Full-text search on drug name, substance, and laboratory.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          example: dipirona
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Drug'

  /v1/medication-offerings:
    get:
      tags:
        - Medication Offerings
      summary: List offerings
      description: |
        List medication offerings.
        - Doctors see their own offerings
        - Receptors see all available offerings
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MedicationOffering'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Medication Offerings
      summary: Create offering
      description: Create a new medication offering. Doctor only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOffering'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MedicationOffering'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /v1/medication-offerings/search:
    get:
      tags:
        - Medication Offerings
      summary: Search offerings
      description: Search available offerings by drug name or substance.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MedicationOfferingSearch'

  /v1/medication-offerings/{id}:
    get:
      tags:
        - Medication Offerings
      summary: Get offering details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MedicationOfferingDetail'
        '404':
          description: Not found

    put:
      tags:
        - Medication Offerings
      summary: Update offering
      description: Update an offering. Doctor only, own offerings.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOffering'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MedicationOffering'
        '403':
          description: Forbidden
        '404':
          description: Not found

    delete:
      tags:
        - Medication Offerings
      summary: Delete offering
      description: Delete an offering. Doctor only, own offerings.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '403':
          description: Forbidden
        '404':
          description: Not found

  /v1/medication-requests:
    get:
      tags:
        - Medication Requests
      summary: List my requests
      description: List requests created by the current receptor.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MedicationRequest'

    post:
      tags:
        - Medication Requests
      summary: Create request
      description: Create a request for a medication offering. Receptor only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - medication_offering_id
              properties:
                medication_offering_id:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MedicationRequest'
        '422':
          description: Validation error (offering not available, duplicate request)

  /v1/medication-requests/received:
    get:
      tags:
        - Medication Requests
      summary: List received requests
      description: List requests received by the current doctor.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MedicationRequest'

  /v1/medication-requests/{id}/confirm:
    patch:
      tags:
        - Medication Requests
      summary: Confirm request
      description: Confirm a medication request. Doctor only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MedicationRequest'
        '403':
          description: Forbidden

  /v1/medication-requests/{id}/reject:
    patch:
      tags:
        - Medication Requests
      summary: Reject request
      description: Reject a medication request. Doctor only. Offering returns to available.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MedicationRequest'
        '403':
          description: Forbidden

  /v1/medication-appointments:
    get:
      tags:
        - Medication Appointments
      summary: List appointments
      description: List pending/confirmed appointments for current user.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MedicationAppointment'

    post:
      tags:
        - Medication Appointments
      summary: Create appointment
      description: Propose an appointment for a confirmed request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointment'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MedicationAppointment'

  /v1/medication-appointments/history:
    get:
      tags:
        - Medication Appointments
      summary: Receptor history
      description: List completed appointments for current receptor.
      responses:
        '200':
          description: Success

  /v1/medication-appointments/doctor-history:
    get:
      tags:
        - Medication Appointments
      summary: Doctor history
      description: List completed appointments for current doctor.
      responses:
        '200':
          description: Success

  /v1/medication-appointments/received:
    get:
      tags:
        - Medication Appointments
      summary: Received appointments
      description: List appointments where current user needs to respond.
      responses:
        '200':
          description: Success

  /v1/medication-appointments/{id}/accept:
    patch:
      tags:
        - Medication Appointments
      summary: Accept appointment
      description: Accept the proposed appointment time.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Accepted

  /v1/medication-appointments/{id}/counter-propose:
    patch:
      tags:
        - Medication Appointments
      summary: Counter-propose
      description: Propose a different time/location.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterPropose'
      responses:
        '200':
          description: Counter-proposed

  /v1/medication-appointments/{id}/confirm-delivery-receptor:
    patch:
      tags:
        - Medication Appointments
      summary: Receptor confirms delivery
      description: Receptor confirms they received the medication.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Confirmed

  /v1/medication-appointments/{id}/confirm-delivery-doctor:
    patch:
      tags:
        - Medication Appointments
      summary: Doctor confirms delivery
      description: Doctor confirms they delivered the medication.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Confirmed

  /v1/doctor-ratings/my-ratings:
    get:
      tags:
        - Doctor Ratings
      summary: My ratings
      description: List ratings submitted by current receptor.
      responses:
        '200':
          description: Success

  /v1/doctor-ratings/doctor/{doctor}:
    get:
      tags:
        - Doctor Ratings
      summary: Doctor's ratings
      description: List all ratings for a specific doctor.
      parameters:
        - name: doctor
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DoctorRating'
                  meta:
                    type: object
                    properties:
                      average_rating:
                        type: number
                        example: 4.8
                      total_ratings:
                        type: integer
                        example: 15

  /v1/doctor-ratings/appointment/{medicationAppointment}:
    get:
      tags:
        - Doctor Ratings
      summary: Rating by appointment
      description: Get rating for a specific appointment.
      parameters:
        - name: medicationAppointment
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
        '404':
          description: Not found

  /v1/doctor-ratings/{medicationAppointment}:
    post:
      tags:
        - Doctor Ratings
      summary: Create rating
      description: Create a rating for a completed appointment. Receptor only.
      parameters:
        - name: medicationAppointment
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRating'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DoctorRating'

  /v1/doctor-ratings/{id}:
    patch:
      tags:
        - Doctor Ratings
      summary: Update rating
      description: Update a rating (comment only). Receptor only, own ratings.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Updated

  /v1/push-tokens:
    post:
      tags:
        - Push Tokens
      summary: Register push token
      description: Register a device for push notifications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - device_type
              properties:
                token:
                  type: string
                  example: ExponentPushToken[xxx]
                device_type:
                  type: string
                  enum: [ios, android]
      responses:
        '201':
          description: Registered

    delete:
      tags:
        - Push Tokens
      summary: Remove push token
      description: Remove current device's push token.
      responses:
        '204':
          description: Removed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum token obtained from /api/login

  schemas:
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: 1|abc123xyz
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Dr. João Silva
        email:
          type: string
          example: joao@example.com
        role:
          type: string
          enum: [doctor, receptor, admin]
        status:
          type: string
          enum: [pending, approved, rejected]

    DoctorRegistration:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
        - phone_number
        - crm
        - crm_uf
        - addresses
        - terms_accepted
      properties:
        name:
          type: string
          example: Dr. João Silva
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string
        phone_number:
          type: string
          pattern: '^\d{10,11}$'
          example: '11999998888'
        crm:
          type: string
          pattern: '^\d{6}$'
          example: '123456'
        crm_uf:
          type: string
          pattern: '^[A-Z]{2}$'
          example: SP
        addresses:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AddressInput'
        terms_accepted:
          type: boolean
          example: true

    ReceptorRegistration:
      type: object
      required:
        - name
        - email
        - cpf
        - password
        - password_confirmation
        - phone_number
        - terms_accepted
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        cpf:
          type: string
          pattern: '^\d{11}$'
          example: '12345678901'
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string
        phone_number:
          type: string
          pattern: '^\d{10,11}$'
        terms_accepted:
          type: boolean

    AddressInput:
      type: object
      required:
        - location_name
        - full_address
        - cep
      properties:
        location_name:
          type: string
          example: Consultório
        full_address:
          type: string
          example: Rua das Flores, 123, São Paulo, SP
        complement:
          type: string
          example: Sala 101
        cep:
          type: string
          pattern: '^\d{8}$'
          example: '01234567'

    Drug:
      type: object
      properties:
        id:
          type: integer
        product_name:
          type: string
          example: Dipirona Sódica
        substance:
          type: string
          example: DIPIRONA SÓDICA
        laboratory:
          type: string
          example: EMS S/A
        registration_number:
          type: string
        presentation:
          type: string
        stripe_color:
          type: string
          enum: [yellow, red, black]

    MedicationOffering:
      type: object
      properties:
        id:
          type: integer
        lot_number:
          type: string
        expires_at:
          type: string
          format: date
        quantity:
          type: integer
        status:
          type: string
          enum: [available, reserved, completed]
        drug:
          $ref: '#/components/schemas/Drug'
        created_at:
          type: string
          format: date-time

    MedicationOfferingSearch:
      type: object
      properties:
        id:
          type: integer
        quantity:
          type: integer
        status:
          type: string
        drug:
          type: object
          properties:
            product_name:
              type: string
        doctor:
          type: object
          properties:
            user:
              type: object
              properties:
                name:
                  type: string

    MedicationOfferingDetail:
      allOf:
        - $ref: '#/components/schemas/MedicationOffering'
        - type: object
          properties:
            doctor:
              type: object
              properties:
                id:
                  type: integer
                crm:
                  type: string
                crm_uf:
                  type: string
                user:
                  $ref: '#/components/schemas/User'
                addresses:
                  type: array
                  items:
                    $ref: '#/components/schemas/Address'

    Address:
      type: object
      properties:
        id:
          type: integer
        location_name:
          type: string
        full_address:
          type: string
        complement:
          type: string
        cep:
          type: string

    CreateOffering:
      type: object
      required:
        - drug_id
        - lot_number
        - expires_at
        - quantity
      properties:
        drug_id:
          type: integer
        lot_number:
          type: string
          maxLength: 50
        expires_at:
          type: string
          format: date
        quantity:
          type: integer
          minimum: 1
          maximum: 100000

    UpdateOffering:
      type: object
      properties:
        lot_number:
          type: string
          maxLength: 50
        expires_at:
          type: string
          format: date
        quantity:
          type: integer
          minimum: 1
          maximum: 100000

    MedicationRequest:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, confirmed, rejected]
        created_at:
          type: string
          format: date-time
        medication_offering:
          $ref: '#/components/schemas/MedicationOffering'
        receptor:
          $ref: '#/components/schemas/User'

    MedicationAppointment:
      type: object
      properties:
        id:
          type: integer
        scheduled_date:
          type: string
          format: date
        scheduled_time:
          type: string
          example: '14:00'
        status:
          type: string
          enum: [proposed, confirmed, completed]
        proposed_by:
          type: string
          enum: [doctor, receptor]
        doctor_confirmed:
          type: boolean
        receptor_confirmed:
          type: boolean
        address:
          $ref: '#/components/schemas/Address'
        medication_request:
          $ref: '#/components/schemas/MedicationRequest'

    CreateAppointment:
      type: object
      required:
        - medication_request_id
        - scheduled_date
        - scheduled_time
      properties:
        medication_request_id:
          type: integer
        scheduled_date:
          type: string
          format: date
        scheduled_time:
          type: string
          example: '14:00'

    CounterPropose:
      type: object
      required:
        - scheduled_date
        - scheduled_time
      properties:
        scheduled_date:
          type: string
          format: date
        scheduled_time:
          type: string
          example: '10:00'
        address_id:
          type: integer

    DoctorRating:
      type: object
      properties:
        id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        created_at:
          type: string
          format: date-time

    CreateRating:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        to:
          type: integer
        total:
          type: integer

    Error:
      type: object
      properties:
        message:
          type: string
          example: Unauthenticated.

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
